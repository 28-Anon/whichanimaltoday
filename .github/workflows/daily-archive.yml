# Runs once daily; picks the animal that was featured yesterday and
# appends it to data/archive.json.
name: Daily Archive

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      - name: Run daily archive job
        run: npm run archive:run

      - name: Commit archive.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet || git commit -m "chore: archive daily puzzle"
          git push
